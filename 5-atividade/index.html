<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feira de Frutas - Compra de Maçãs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="caixote-feira">
        <header>
            <div class="logotipo">
                🍎 <span>Quitanda do Zé</span> 🧺
            </div>
            <h1>Maçãs Fresquinhas!</h1>
        </header>

        <main>
            <div class="tabela-precos">
                <p>Menos de 1 dúzia: <strong>R$ 1,30 a unidade</strong></p>
                <p>A partir de 1 dúzia (12+): <strong>R$ 1,00 a unidade</strong></p>
            </div>

            <div class="campo-entrada">
                <label for="quantidade">Quantas maçãs você quer levar?</label>
                <input type="number" id="quantidade" min="1" placeholder="Ex: 5">
            </div>

            <button onclick="calcularValor()">Calcular Total</button>

            <div id="resultado" class="resultado"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
