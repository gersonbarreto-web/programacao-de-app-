<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Verificação de Aposentadoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="logo">🏦 Banco Previdência</div>

    <h2>Verificar Aposentadoria</h2>

    <form id="form">
        <label>Matrícula:</label>
        <input type="text" id="codigo" required>

        <label>Ano de nascimento:</label>
        <input type="number" id="ano" required>

        <label>Tempo de trabalho (anos):</label>
        <input type="number" id="tempo" required>

        <button type="submit">Verificar</button>
    </form>

    <div id="resultado"></div>
</div>

<script src="script.js"></script>
</body>
</html>
